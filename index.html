<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชีทเรียน — ตระกูล A</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f2ea;
    --surface: #ffffff;
    --ink: #1a2620;
    --ink-soft: #6c7568;
    --ink-faint: #9a9d8f;
    --border: #e2ded0;
    --border-soft: #ebe8dd;
    --green: #2f6b47;
    --green-deep: #163527;
    --green-tint: #eaf3ec;
    --amber: #b8752f;
    --amber-tint: #fbeadb;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(22,53,39,0.06);
    --shadow-hover: 0 10px 24px rgba(22,53,39,0.12);

    /* element-tile palette, one hue per file type */
    --t-pdf-fg: #a13d1e;  --t-pdf-bg: #fbe4d6;
    --t-doc-fg: #2a4d84;  --t-doc-bg: #e2ebf6;
    --t-ppt-fg: #a15a10;  --t-ppt-bg: #f8e6ce;
    --t-xls-fg: #1f6b45;  --t-xls-bg: #dcf0e2;
    --t-img-fg: #7a3a91;  --t-img-bg: #f0e2f7;
    --t-def-fg: #6c5a1f;  --t-def-bg: #f3edd4;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin: 0;
    background: var(--bg);
    font-family: 'Sarabun', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  mark{
    background: #ffdf94;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  a{ color: inherit; }

  /* ---------- Header ---------- */
  header{
    position: relative;
    background: var(--green-deep);
    background-image:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 82% 78%, rgba(255,255,255,0.04) 0, transparent 45%);
    color: #fff;
    padding: 36px 20px 46px;
    text-align: center;
    overflow: hidden;
  }
  header .hex-field{
    position: absolute; inset: 0;
    opacity: 0.16;
    pointer-events: none;
  }
  header .hex-field svg{ width: 100%; height: 100%; display: block; }
  header .eyebrow{
    position: relative;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 1.6px;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  header h1{
    position: relative;
    font-size: clamp(1.4rem, 4.4vw, 1.8rem);
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  header p{
    position: relative;
    margin: 0;
    font-size: 0.86rem;
    color: rgba(255,255,255,0.68);
  }

  /* ---------- Sticky search + filter bar ---------- */
  .toolbar{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    margin-top: -20px;
    border-radius: 18px 18px 0 0;
  }
  .toolbar-inner{ max-width: 880px; margin: 0 auto; }

  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-box:focus-within{
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-tint);
  }
  .search-box svg{ flex:none; color: var(--ink-faint); }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:'Sarabun', sans-serif; font-size: 1rem; color: var(--ink);
    min-width: 0;
  }
  .search-box input::placeholder{ color:#a3a397; }
  .search-hint{
    flex:none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--ink-faint);
    background: var(--border-soft);
    padding: 3px 7px;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }
  .search-box.has-value .search-hint{ display: none; }
  .search-box .clear-btn{
    flex:none;
    border:none; background: var(--border); color: var(--ink-soft);
    width: 22px; height: 22px; border-radius: 50%;
    display:none; align-items:center; justify-content:center;
    cursor: pointer; font-size: 0.85rem; line-height:1; padding:0;
  }
  .search-box.has-value .clear-btn{ display:flex; }

  .chip-row{
    display:flex; gap: 8px; overflow-x: auto;
    margin-top: 10px; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex: none;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s ease;
  }
  .chip:hover{ border-color: var(--green); color: var(--green-deep); }
  .chip.active{
    background: var(--green-deep);
    border-color: var(--green-deep);
    color: #fff;
  }

  .result-count{
    max-width: 880px; margin: 10px auto 0; padding: 0 4px;
    font-size: 0.8rem; color: var(--ink-soft);
  }

  /* ---------- Main ---------- */
  main{ max-width: 880px; margin: 0 auto; padding: 4px 16px 80px; }

  .drawer-group{ margin-top: 26px; animation: rise 0.35s ease both; }
  .drawer-group h2{
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 0.86rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--green-deep);
    margin: 0 0 10px;
    padding-left: 2px;
  }
  .drawer-group h2 .code{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
  }
  .drawer-group h2 .sep{ color: var(--ink-faint); font-weight: 400; }
  .drawer-group h2 .who{
    color: var(--ink-soft);
    font-weight: 500;
  }

  .list{
    display:flex; flex-direction:column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .row{
    display:flex; align-items:center; gap: 13px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border-soft);
    text-decoration: none;
    color: var(--ink);
    transition: background 0.12s ease;
  }
  .row:last-child{ border-bottom: none; }
  .row:hover, .row:focus-visible{ background: var(--green-tint); }
  .row:focus-visible{ outline: 2px solid var(--green); outline-offset: -2px; }
  .row:active{ background: #dfece3; }

  /* periodic-tile style badge */
  .row .badge{
    position: relative;
    flex:none;
    width: 40px; height: 40px;
    border-radius: 8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.2px;
  }
  .row .badge .idx{
    position: absolute; top: 3px; left: 4px;
    font-size: 0.5rem; font-weight: 600;
    opacity: 0.6;
  }

  .row .info{ flex: 1; min-width: 0; }
  .row .info .name{
    font-size: 0.95rem; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .info .meta{
    font-size: 0.76rem; color: var(--ink-soft);
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .row .status-pill{
    flex:none;
    font-size: 0.68rem;
    font-weight: 600;
    background: var(--amber-tint);
    color: var(--amber);
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .row .go{
    flex:none;
    color: var(--ink-faint);
    transition: transform 0.12s ease, color 0.12s ease;
  }
  .row:hover .go{ color: var(--green-deep); transform: translateX(2px); }

  /* ---------- States ---------- */
  .state{ text-align:center; padding: 60px 20px; color: var(--ink-soft); }
  .state svg{ opacity: 0.55; color: var(--green-deep); }
  .state h2{ font-size: 1.1rem; color: var(--ink); margin: 14px 0 6px; font-weight: 700; }
  .state p{ margin: 0 auto; max-width: 40ch; font-size: 0.88rem; line-height: 1.5; }
  .state button{
    margin-top: 18px;
    font-family:'Sarabun', sans-serif; font-weight: 600; font-size: 0.88rem;
    color: #fff; background: var(--green-deep); border:none;
    padding: 10px 22px; border-radius: 8px; cursor: pointer;
    transition: background 0.12s ease;
  }
  .state button:hover{ background: var(--green); }

  .skeleton-list{
    display:flex; flex-direction:column; gap: 1px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .skel-row{
    height: 66px;
    background: linear-gradient(100deg, #ece9dc 25%, #f6f5ef 45%, #ece9dc 65%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }
  @keyframes rise{ from{ opacity: 0; transform: translateY(6px); } to{ opacity: 1; transform: translateY(0); } }

  footer{
    text-align:center; padding: 22px;
    font-size: 0.74rem; color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.4px;
  }

  @media (max-width: 480px){
    .row .meta{ display: none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="hex-field" aria-hidden="true">
    <svg viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="#ffffff" stroke-width="1">
        <path d="M20 10 L38 20 L38 40 L20 50 L2 40 L2 20 Z"/>
        <path d="M58 10 L76 20 L76 40 L58 50 L40 40 L40 20 Z"/>
        <path d="M39 40 L57 50 L57 70 L39 80 L21 70 L21 50 Z"/>
        <path d="M340 90 L358 100 L358 120 L340 130 L322 120 L322 100 Z"/>
        <path d="M378 70 L396 80 L396 100 L378 110 L360 100 L360 80 Z"/>
        <path d="M300 120 L318 130 L318 150 L300 160 L282 150 L282 130 Z"/>
      </g>
    </svg>
  </div>
  <p class="eyebrow">KMUTT · Faculty of Science</p>
  <h1>คลังชีทเรียน — ตระกูล A</h1>
  <p>สำหรับตระกูล A เท่านั้น · ห้ามเผยแพร่</p>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-box" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="ค้นหารหัสวิชา เช่น CHM10101" autocomplete="off" inputmode="search">
      <span class="search-hint">รหัสวิชา</span>
      <button class="clear-btn" id="clearBtn" aria-label="ล้างคำค้นหา">✕</button>
    </div>
    <div class="chip-row" id="chipRow"></div>
  </div>
  <div class="result-count" id="resultCount"></div>
</div>

<main id="main">
  <div class="skeleton-list">
    <div class="skel-row"></div>
    <div class="skel-row"></div>
    <div class="skel-row"></div>
    <div class="skel-row"></div>
    <div class="skel-row"></div>
  </div>
</main>

<footer>KS</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxz7shP023tKRqA_V57WLeQFgzQTxfFSawvGMz8KxgIz_ASsys5fwdx0GYlZO4CYKcX/exec?export=json";

  const mainEl = document.getElementById('main');
  const searchInput = document.getElementById('searchInput');
  const searchBox = document.getElementById('searchBox');
  const clearBtn = document.getElementById('clearBtn');
  const resultCount = document.getElementById('resultCount');
  const chipRow = document.getElementById('chipRow');

  let allFiles = [];
  let activeGroup = "";

  // แปลงค่าใดๆ ให้เป็น string อย่างปลอดภัยเสมอ
  function toStr(v){
    if(v === null || v === undefined) return "";
    if(typeof v === "string") return v;
    if(Array.isArray(v)) return v.join(" / ");
    if(typeof v === "object") return JSON.stringify(v);
    return String(v);
  }

  function escapeHtml(str){
    return toStr(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeRegex(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function normCode(str){ return toStr(str).toLowerCase().replace(/\s+/g, ''); }

  function highlight(text, rawQuery){
    const safe = escapeHtml(text);
    if(!rawQuery || !rawQuery.trim()) return safe;
    const pattern = new RegExp(escapeRegex(escapeHtml(rawQuery)), 'gi');
    return safe.replace(pattern, (m) => `<mark>${m}</mark>`);
  }

  function pathParts(path){
    return toStr(path).split('/').map(s => s.trim()).filter(Boolean);
  }

  // "รหัสวิชา" = ส่วนที่อยู่ก่อนส่วนสุดท้ายของ path เสมอ เช่น
  // คลัง A / Year 1 / เทอม 1 / CHM101 / CHM 10101 / P'หนุ่มตี๋ใกล้ฉัน
  //                                     ^^^^^^^^^^ รหัสวิชา
  function courseCode(path){
    const parts = pathParts(path);
    if(parts.length >= 2) return parts[parts.length - 2];
    return parts[0] || "";
  }

  // ป้ายกลุ่มที่แสดงผล = "รหัสวิชา / ผู้ดูแล" (2 ส่วนท้ายของ path)
  function courseLabel(path){
    const parts = pathParts(path);
    if(parts.length >= 2) return parts.slice(-2).join(' / ');
    return parts[0] || "ไม่ระบุหมวดหมู่";
  }

  function fileExt(name){
    const m = /\.([a-zA-Z0-9]+)$/.exec(toStr(name));
    return m ? m[1].toUpperCase() : "PDF";
  }

  function tileClass(ext){
    const e = ext.toLowerCase();
    if(e === 'pdf') return 't-pdf';
    if(['doc','docx'].includes(e)) return 't-doc';
    if(['ppt','pptx'].includes(e)) return 't-ppt';
    if(['xls','xlsx','csv'].includes(e)) return 't-xls';
    if(['jpg','jpeg','png','gif','webp'].includes(e)) return 't-img';
    return 't-def';
  }

  function groupByLabel(files){
    const groups = {};
    files.forEach(f => {
      const key = courseLabel(f.path);
      if(!groups[key]) groups[key] = [];
      groups[key].push(f);
    });
    return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'th')).map(key => ({
      label: key,
      items: groups[key]
    }));
  }

  function renderChips(){
    const labels = [...new Set(allFiles.map(f => courseLabel(f.path)))].sort((a,b)=>a.localeCompare(b,'th'));
    if(labels.length <= 1){ chipRow.innerHTML = ""; return; }
    const all = `<button class="chip${activeGroup === "" ? " active" : ""}" data-label="">ทั้งหมด</button>`;
    const rest = labels.map(l => `<button class="chip${activeGroup === l ? " active" : ""}" data-label="${escapeHtml(l)}">${escapeHtml(l)}</button>`).join("");
    chipRow.innerHTML = all + rest;
    chipRow.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activeGroup = btn.getAttribute('data-label');
        applyFilters();
      });
    });
  }

  function renderFiles(files, query){
    if(files.length === 0){
      mainEl.innerHTML = `
        <div class="state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
          <h2>ไม่พบชีทที่ค้นหา</h2>
          <p>ลองพิมพ์รหัสวิชาอื่น หรือกดตัวกรองเป็น "ทั้งหมด" อีกครั้ง</p>
        </div>`;
      return;
    }

    const groups = groupByLabel(files);
    mainEl.innerHTML = groups.map(group => {
      const parts = group.label.split(' / ');
      const code = parts[0] || group.label;
      const who = parts.slice(1).join(' / ');
      return `
      <section class="drawer-group">
        <h2><span class="code">${escapeHtml(code)}</span>${who ? `<span class="sep">/</span><span class="who">${escapeHtml(who)}</span>` : ''}</h2>
        <div class="list">
          ${group.items.map((f, i) => {
            const ext = fileExt(f.name);
            return `
            <a class="row" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">
              <span class="badge ${tileClass(ext)}"><span class="idx">${i + 1}</span>${escapeHtml(ext)}</span>
              <span class="info">
                <span class="name">${highlight(f.name, query)}</span>
                <span class="meta">${escapeHtml(group.label)}</span>
              </span>
              ${f.status ? `<span class="status-pill">${escapeHtml(f.status)}</span>` : ''}
              <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>`;
          }).join('')}
        </div>
      </section>`;
    }).join('');
  }

  function applyFilters(){
    const q = searchInput.value.trim();
    const qNorm = normCode(q);

    let filtered = allFiles;
    if(activeGroup){
      filtered = filtered.filter(f => courseLabel(f.path) === activeGroup);
    }
    if(qNorm){
      // ค้นหาเทียบกับ "รหัสวิชา" เท่านั้น (ไม่สนใจช่องว่าง ตัวพิมพ์เล็ก/ใหญ่)
      filtered = filtered.filter(f => normCode(courseCode(f.path)).includes(qNorm));
    }

    resultCount.textContent = `${filtered.length} ไฟล์`;
    searchBox.classList.toggle('has-value', q.length > 0);
    renderChips();
    renderFiles(filtered, q);
  }

  function showError(message){
    chipRow.innerHTML = "";
    resultCount.textContent = "";
    mainEl.innerHTML = `
      <div class="state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path><line x1="9" y1="13" x2="15" y2="13"></line></svg>
        <h2>โหลดข้อมูลไม่สำเร็จ</h2>
        <p>${escapeHtml(message)}</p>
        <button onclick="loadFiles()">ลองใหม่อีกครั้ง</button>
      </div>`;
  }

  async function loadFiles(){
    mainEl.innerHTML = `
      <div class="skeleton-list">
        <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
        <div class="skel-row"></div><div class="skel-row"></div>
      </div>`;
    resultCount.textContent = "";
    chipRow.innerHTML = "";

    try{
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับสถานะ ${res.status}`);
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error("รูปแบบข้อมูลที่ได้รับไม่ถูกต้อง");

      allFiles = data;

      if(allFiles.length === 0){
        mainEl.innerHTML = `
          <div class="state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 7l3-4h12l3 4"></path></svg>
            <h2>ยังไม่มีเอกสารในคลัง</h2>
            <p>เมื่อมีการอัปโหลดชีทใหม่ รายการจะแสดงที่นี่โดยอัตโนมัติ</p>
          </div>`;
        return;
      }

      applyFilters();
    }catch(err){
      showError(err.message || "ไม่สามารถเชื่อมต่อกับ API ได้ กรุณาตรวจสอบ URL หรือลองใหม่อีกครั้ง");
    }
  }

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applyFilters, 120);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = "";
    applyFilters();
    searchInput.focus();
  });

  loadFiles();
</script>

<style>
  .t-pdf{ background: var(--t-pdf-bg); color: var(--t-pdf-fg); }
  .t-doc{ background: var(--t-doc-bg); color: var(--t-doc-fg); }
