<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชีทเรียน — ตระกูล A</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f7f7f5;
    --surface: #ffffff;
    --ink: #1c2620;
    --ink-soft: #6b7469;
    --border: #e4e2da;
    --green: #2f6844;
    --green-deep: #1f4b31;
    --green-tint: #eaf2ec;
    --amber: #c07a3d;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(28,38,32,0.06);
    --shadow-hover: 0 6px 20px rgba(28,38,32,0.10);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin: 0;
    background: var(--bg);
    font-family: 'Sarabun', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  mark{
    background: #ffe6a8;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  a{ color: inherit; }

  /* ---------- Header ---------- */
  header{
    background: var(--green-deep);
    color: #fff;
    padding: 28px 20px 22px;
    text-align: center;
  }
  header h1{
    font-size: clamp(1.3rem, 4vw, 1.6rem);
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  header p{
    margin: 0;
    font-size: 0.86rem;
    color: rgba(255,255,255,0.72);
  }

  /* ---------- Sticky search + filter bar ---------- */
  .toolbar{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .toolbar-inner{ max-width: 880px; margin: 0 auto; }

  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease;
  }
  .search-box:focus-within{
    border-color: var(--green);
  }
  .search-box svg{ flex:none; color: var(--ink-soft); }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:'Sarabun', sans-serif; font-size: 1rem; color: var(--ink);
    min-width: 0;
  }
  .search-box input::placeholder{ color:#9a9a8f; }
  .search-box .clear-btn{
    flex:none;
    border:none; background: var(--border); color: var(--ink-soft);
    width: 22px; height: 22px; border-radius: 50%;
    display:none; align-items:center; justify-content:center;
    cursor: pointer; font-size: 0.85rem; line-height:1; padding:0;
  }
  .search-box.has-value .clear-btn{ display:flex; }

  .chip-row{
    display:flex; gap: 8px; overflow-x: auto;
    margin-top: 10px; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex: none;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.12s ease;
  }
  .chip:hover{ border-color: var(--green); color: var(--green-deep); }
  .chip.active{
    background: var(--green-deep);
    border-color: var(--green-deep);
    color: #fff;
  }

  .result-count{
    max-width: 880px; margin: 10px auto 0; padding: 0 4px;
    font-size: 0.8rem; color: var(--ink-soft);
  }

  /* ---------- Main ---------- */
  main{ max-width: 880px; margin: 0 auto; padding: 4px 16px 80px; }

  .drawer-group{ margin-top: 26px; }
  .drawer-group h2{
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink-soft);
    margin: 0 0 10px;
    padding-left: 2px;
  }

  .list{
    display:flex; flex-direction:column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .row{
    display:flex; align-items:center; gap: 12px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--ink);
    transition: background 0.12s ease;
  }
  .row:last-child{ border-bottom: none; }
  .row:hover, .row:focus-visible{ background: var(--green-tint); }
  .row:focus-visible{ outline: 2px solid var(--green); outline-offset: -2px; }
  .row:active{ background: #dfece3; }

  .row .badge{
    flex:none;
    width: 38px; height: 38px;
    border-radius: 9px;
    background: #fbeae0;
    color: var(--amber);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.62rem; font-weight: 700;
  }

  .row .info{ flex: 1; min-width: 0; }
  .row .info .name{
    font-size: 0.95rem; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .info .meta{
    font-size: 0.76rem; color: var(--ink-soft);
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .row .status-pill{
    flex:none;
    font-size: 0.68rem;
    background: #fff6c4;
    color: #6b5a1d;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .row .go{
    flex:none;
    color: var(--ink-soft);
  }
  .row:hover .go{ color: var(--green-deep); }

  /* ---------- States ---------- */
  .state{ text-align:center; padding: 60px 20px; color: var(--ink-soft); }
  .state svg{ opacity: 0.6; }
  .state h2{ font-size: 1.1rem; color: var(--ink); margin: 14px 0 6px; font-weight: 700; }
  .state p{ margin: 0 auto; max-width: 40ch; font-size: 0.88rem; line-height: 1.5; }
  .state button{
    margin-top: 18px;
    font-family:'Sarabun', sans-serif; font-weight: 600; font-size: 0.88rem;
    color: #fff; background: var(--green-deep); border:none;
    padding: 10px 22px; border-radius: 8px; cursor: pointer;
  }
  .state button:hover{ background: var(--green); }

  .skeleton-list{
    display:flex; flex-direction:column; gap: 1px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .skel-row{
    height: 64px;
    background: linear-gradient(100deg, #eeece4 25%, #f6f5f0 45%, #eeece4 65%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }

  footer{
    text-align:center; padding: 20px;
    font-size: 0.75rem; color: var(--ink-soft);
  }

  @media (max-width: 480px){
    .row .meta{ display: none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>คลังชีทเรียน — ตระกูล A</h1>
  <p>สำหรับตระกูล A เท่านั้น · ห้ามเผยแพร่</p>
</header>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="search-box" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="ค้นหารหัสวิชา หรือชื่อไฟล์" autocomplete="off" inputmode="search">
      <button class="clear-btn" id="clearBtn" aria-label="ล้างคำค้นหา">✕</button>
    </div>
    <div class="chip-row" id="chipRow"></div>
  </div>
  <div class="result-count" id="resultCount"></div>
</div>

<main id="main">
  <div class="skeleton-list">
    <div class="skel-row"></div>
    <div class="skel-row"></div>
    <div class="skel-row"></div>
    <div class="skel-row"></div>
    <div class="skel-row"></div>
  </div>
</main>

<footer>KS</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxz7shP023tKRqA_V57WLeQFgzQTxfFSawvGMz8KxgIz_ASsys5fwdx0GYlZO4CYKcX/exec?export=json";

  const mainEl = document.getElementById('main');
  const searchInput = document.getElementById('searchInput');
  const searchBox = document.getElementById('searchBox');
  const clearBtn = document.getElementById('clearBtn');
  const resultCount = document.getElementById('resultCount');
  const chipRow = document.getElementById('chipRow');

  let allFiles = [];
  let activePath = "";

  // แปลงค่าใดๆ ให้เป็น string อย่างปลอดภัยเสมอ
  function toStr(v){
    if(v === null || v === undefined) return "";
    if(typeof v === "string") return v;
    if(Array.isArray(v)) return v.join(" / ");
    if(typeof v === "object") return JSON.stringify(v);
    return String(v);
  }

  function escapeHtml(str){
    return toStr(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeRegex(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function highlight(text, rawQuery){
    const safe = escapeHtml(text);
    if(!rawQuery || !rawQuery.trim()) return safe;
    const pattern = new RegExp(escapeRegex(escapeHtml(rawQuery)), 'gi');
    return safe.replace(pattern, (m) => `<mark>${m}</mark>`);
  }

  function fileExt(name){
    const m = /\.([a-zA-Z0-9]+)$/.exec(toStr(name));
    return m ? m[1].toUpperCase() : "PDF";
  }

  function groupByPath(files){
    const groups = {};
    files.forEach(f => {
      const key = toStr(f.path) || "ไม่ระบุหมวดหมู่";
      if(!groups[key]) groups[key] = [];
      groups[key].push(f);
    });
    return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'th')).map(key => ({
      path: key,
      items: groups[key]
    }));
  }

  function renderChips(){
    const paths = [...new Set(allFiles.map(f => toStr(f.path) || "ไม่ระบุหมวดหมู่"))].sort((a,b)=>a.localeCompare(b,'th'));
    if(paths.length <= 1){ chipRow.innerHTML = ""; return; }
    const all = `<button class="chip${activePath === "" ? " active" : ""}" data-path="">ทั้งหมด</button>`;
    const rest = paths.map(p => `<button class="chip${activePath === p ? " active" : ""}" data-path="${escapeHtml(p)}">${escapeHtml(p)}</button>`).join("");
    chipRow.innerHTML = all + rest;
    chipRow.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        activePath = btn.getAttribute('data-path');
        applyFilters();
      });
    });
  }

  function renderFiles(files, query){
    if(files.length === 0){
      mainEl.innerHTML = `
        <div class="state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
          <h2>ไม่พบชีทที่ค้นหา</h2>
          <p>ลองพิมพ์คำอื่น หรือกดตัวกรองเป็น "ทั้งหมด" อีกครั้ง</p>
        </div>`;
      return;
    }

    const groups = groupByPath(files);
    mainEl.innerHTML = groups.map(group => `
      <section class="drawer-group">
        <h2>${escapeHtml(group.path)}</h2>
        <div class="list">
          ${group.items.map(f => `
            <a class="row" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">
              <span class="badge">${escapeHtml(fileExt(f.name))}</span>
              <span class="info">
                <span class="name">${highlight(f.name, query)}</span>
                <span class="meta">${highlight(group.path, query)}</span>
              </span>
              ${f.status ? `<span class="status-pill">${escapeHtml(f.status)}</span>` : ''}
              <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
          `).join('')}
        </div>
      </section>
    `).join('');
  }

  function applyFilters(){
    const q = searchInput.value.trim();
    const qLower = q.toLowerCase();

    let filtered = allFiles;
    if(activePath){
      filtered = filtered.filter(f => (toStr(f.path) || "ไม่ระบุหมวดหมู่") === activePath);
    }
    if(qLower){
      filtered = filtered.filter(f =>
        toStr(f.name).toLowerCase().includes(qLower) ||
        toStr(f.path).toLowerCase().includes(qLower));
    }

    resultCount.textContent = `${filtered.length} ไฟล์`;
    searchBox.classList.toggle('has-value', q.length > 0);
    renderChips();
    renderFiles(filtered, q);
  }

  function showError(message){
    chipRow.innerHTML = "";
    resultCount.textContent = "";
    mainEl.innerHTML = `
      <div class="state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path><line x1="9" y1="13" x2="15" y2="13"></line></svg>
        <h2>โหลดข้อมูลไม่สำเร็จ</h2>
        <p>${escapeHtml(message)}</p>
        <button onclick="loadFiles()">ลองใหม่อีกครั้ง</button>
      </div>`;
  }

  async function loadFiles(){
    mainEl.innerHTML = `
      <div class="skeleton-list">
        <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
        <div class="skel-row"></div><div class="skel-row"></div>
      </div>`;
    resultCount.textContent = "";
    chipRow.innerHTML = "";

    try{
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับสถานะ ${res.status}`);
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error("รูปแบบข้อมูลที่ได้รับไม่ถูกต้อง");

      allFiles = data;

      if(allFiles.length === 0){
        mainEl.innerHTML = `
          <div class="state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 7l3-4h12l3 4"></path></svg>
            <h2>ยังไม่มีเอกสารในคลัง</h2>
            <p>เมื่อมีการอัปโหลดชีทใหม่ รายการจะแสดงที่นี่โดยอัตโนมัติ</p>
          </div>`;
        return;
      }

      applyFilters();
    }catch(err){
      showError(err.message || "ไม่สามารถเชื่อมต่อกับ API ได้ กรุณาตรวจสอบ URL หรือลองใหม่อีกครั้ง");
    }
  }

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applyFilters, 120);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = "";
    applyFilters();
    searchInput.focus();
  });

  loadFiles();
</script>

</body>
</html>
