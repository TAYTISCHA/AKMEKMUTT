<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชีทเรียน — ตระกูล A </title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f0e2;
    --wood: #d8c8a3;
    --wood-dark: #b89f6d;
    --wood-deep: #8f7748;
    --ink: #23301f;
    --ink-soft: #5b6553;
    --green: #2f6844;
    --green-deep: #1f4b31;
    --amber: #c07a3d;
    --gold: #e3ac53;
    --red: #a3384a;
    --card: #fffdf7;
    --border: #ddd0ac;
    --shadow: rgba(35, 48, 31, 0.18);
    --radius: 3px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(216,200,163,0.35), transparent 60%),
      var(--bg);
    font-family: 'Sarabun', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  mark{
    background: linear-gradient(180deg, transparent 60%, rgba(227,172,83,0.65) 60%);
    color: inherit;
    border-radius: 1px;
  }

  /* ---------- Header : drawer front with light sweep ---------- */
  header{
    position: relative;
    background: linear-gradient(180deg, var(--wood-dark), var(--wood) 90%);
    border-bottom: 6px solid var(--green-deep);
    padding: 60px 24px 44px;
    text-align: center;
    overflow: hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.035) 0 2px, transparent 2px 90px);
    pointer-events:none;
  }
  .light-sweep{
    position:absolute;
    top: -40%; left: -30%;
    width: 60%; height: 180%;
    background: linear-gradient(100deg, transparent, rgba(255,252,235,0.28) 40%, transparent 60%);
    transform: rotate(8deg);
    animation: sweep 9s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%, 100%{ transform: translateX(0) rotate(8deg); }
    50%{ transform: translateX(160%) rotate(8deg); }
  }
  .motes{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .mote{
    position:absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,230,0.9), transparent 70%);
    animation: drift 7s ease-in-out infinite;
    opacity: 0;
  }

  @keyframes drift{
    0%{ opacity:0; transform: translateY(20px) scale(0.8); }
    15%{ opacity: 0.8; }
    85%{ opacity: 0.5; }
    100%{ opacity:0; transform: translateY(-90px) scale(1.1); }
  }

  .drawer-pull{
    width: 64px; height: 10px;
    background: var(--green-deep);
    border-radius: 6px;
    margin: 0 auto 22px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2) inset, 0 3px 4px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
  }
  header h1{
    font-family: 'Taviraj', serif;
    font-weight: 700;
    font-size: clamp(2rem, 4.5vw, 3rem);
    margin: 0 0 8px;
    color: var(--green-deep);
    letter-spacing: 0.5px;
    position: relative; z-index: 2;
  }
  header p{
    margin: 0 auto;
    color: #4a4023;
    font-size: 1rem;
    max-width: 46ch;
    opacity: 0.85;
    position: relative; z-index: 2;
  }
  .label-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green-deep);
    background: rgba(255,253,247,0.7);
    border: 1px solid rgba(31,75,49,0.3);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
    position: relative; z-index: 2;
  }

  /* ---------- Search rail ---------- */
  .search-rail{
    max-width: 720px;
    margin: -26px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 5;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    box-shadow: 0 10px 24px var(--shadow);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .search-box:focus-within{
    box-shadow: 0 14px 30px var(--shadow), 0 0 0 3px rgba(47,104,68,0.18);
    transform: translateY(-1px);
  }
  .search-box svg{ flex:none; color: var(--ink-soft); transition: color 0.2s ease, transform 0.2s ease; }
  .search-box:focus-within svg{ color: var(--green-deep); transform: scale(1.08); }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:'Sarabun', sans-serif; font-size: 1rem; color: var(--ink);
  }
  .search-box input::placeholder{ color:#9a927b; }
  .search-count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* ---------- Main content ---------- */
  main{ max-width: 980px; margin: 0 auto; padding: 40px 20px 100px; }

  .drawer-group{
    margin-bottom: 40px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .drawer-group.in-view{ opacity: 1; transform: translateY(0); }

  .drawer-label{ display:flex; align-items:center; gap: 12px; margin-bottom: 16px; }
  .drawer-label .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase;
    background: var(--green-deep); color: #f6f0e2;
    padding: 5px 12px; border-radius: 2px 10px 10px 2px;
  }
  .drawer-label .path-text{
    font-family:'Taviraj', serif; font-size: 1.15rem; font-weight: 600; color: var(--green-deep);
  }
  .drawer-label .rule{
    flex:1; height:1px;
    background: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 10px);
  }

  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px 16px;
  }

  .card{
    --tilt: 0deg;
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 18px 18px;
    box-shadow: 0 1px 0 rgba(35,48,31,0.05);
    transition: transform 0.22s cubic-bezier(.2,.8,.3,1.15), box-shadow 0.22s ease;
    opacity: 0;
    transform: translateY(10px) rotate(var(--tilt));
    animation: cardIn 0.5s ease forwards;
    animation-delay: var(--stagger, 0ms);
    overflow: hidden;
  }
  @keyframes cardIn{
    to{ opacity: 1; transform: translateY(0) rotate(var(--tilt)); }
  }
  .card:hover{
    transform: translateY(-6px) rotate(0deg) scale(1.015);
    box-shadow: 0 18px 30px var(--shadow);
    border-color: var(--wood-dark);
    z-index: 3;
  }

  /* dog-ear fold */
  .card::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 18px 18px 0;
    border-color: transparent var(--bg) transparent transparent;
    filter: drop-shadow(-1px 1px 1px rgba(35,48,31,0.25));
    transition: border-width 0.22s ease;
  }
  .card:hover::after{ border-width: 0 26px 26px 0; }

  /* pushpin */
  .card .pin{
    position:absolute; top: -8px; left: 20px;
    width: 16px; height: 16px;
    z-index: 2;
    filter: drop-shadow(1px 2px 2px rgba(35,48,31,0.35));
  }

  .card .row-id{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--card);
    background: var(--amber);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
    margin-left: 14px;
    margin-bottom: 10px;
  }

  .card .status-note{
    position:absolute;
    top: -10px; right: 30px;
    background: #fff6c4;
    color: #6b5a1d;
    font-size: 0.68rem;
    font-family:'Sarabun', sans-serif;
    padding: 4px 10px;
    border-radius: 2px;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.18);
    transform: rotate(3deg);
    max-width: 60%;
  }

  .card .file-icon{
    width: 36px; height: 36px;
    border-radius: 6px;
    background: linear-gradient(160deg, var(--red), #7f2836);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    font-weight:600;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    transition: transform 0.22s ease;
  }
  .card:hover .file-icon{ transform: rotate(-6deg) scale(1.05); }

  .card h3{
    font-family:'Taviraj', serif;
    font-size: 1.08rem;
    font-weight: 600;
    margin: 0 0 6px;
    color: var(--ink);
    line-height: 1.35;
    word-break: break-word;
  }

  .card .path-breadcrumb{ font-size: 0.78rem; color: var(--ink-soft); margin: 0 0 16px; }

  .card a.open-link{
    display:inline-flex; align-items:center; gap: 8px;
    font-family:'Sarabun', sans-serif; font-size: 0.88rem; font-weight: 600;
    color: var(--green-deep); text-decoration: none;
    border-bottom: 1.5px solid transparent;
    transition: border-color 0.15s ease, gap 0.15s ease;
  }
  .card a.open-link:hover{ border-color: var(--green-deep); gap: 11px; }
  .card a.open-link:focus-visible,
  .search-box input:focus-visible{ outline: 2px solid var(--green); outline-offset: 3px; }

  .card a.open-link.stamped::before{
    content:"เปิดแล้ว";
    position:absolute;
    top: 40%; left: 50%;
    transform: translate(-50%,-50%) rotate(-14deg) scale(1.6);
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.9rem; font-weight: 700; letter-spacing: 2px;
    color: rgba(163,56,74,0.75);
    border: 2px solid rgba(163,56,74,0.75);
    padding: 4px 12px; border-radius: 4px;
    opacity: 0;
    animation: stamp 0.55s ease forwards;
    pointer-events: none;
  }
  @keyframes stamp{
    0%{ opacity:0; transform: translate(-50%,-50%) rotate(-14deg) scale(2.4); }
    60%{ opacity:0.9; transform: translate(-50%,-50%) rotate(-14deg) scale(1.4); }
    100%{ opacity:0.85; transform: translate(-50%,-50%) rotate(-14deg) scale(1.6); }
  }

  /* ---------- States ---------- */
  .state{ text-align:center; padding: 60px 20px; color: var(--ink-soft); }
  .state svg{ opacity: 0.8; }
  .state h2{ font-family:'Taviraj', serif; color: var(--ink); font-size: 1.4rem; margin: 16px 0 8px; }
  .state p{ margin: 0 auto; max-width: 40ch; font-size: 0.94rem; }
  .state button{
    margin-top: 20px;
    font-family:'Sarabun', sans-serif; font-weight: 600; font-size: 0.9rem;
    color: #fff; background: var(--green-deep); border:none;
    padding: 10px 22px; border-radius: 4px; cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .state button:hover{ background: var(--green); transform: translateY(-1px); }

  .skeleton-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .skeleton{
    height: 140px;
    border-radius: var(--radius);
    background: linear-gradient(100deg, #ece2c8 20%, #f7f1e2 40%, #ece2c8 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite, riseIn 0.4s ease forwards;
    animation-delay: 0s, var(--stagger, 0ms);
    border: 1px solid var(--border);
    opacity: 0;
  }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }
  @keyframes riseIn{ to{ opacity: 1; } }

  footer{
    text-align:center; padding: 28px 24px;
    font-size: 0.75rem; color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="light-sweep"></div>
  <div class="motes" id="motes"></div>
  <div class="drawer-pull"></div>
  <span class="label-tag">Chemistry CLAN A Archive</span>
  <h1>คลังชีทเรียน</h1>
  <p>สำหรับตระกูล A เท่านั้น ห้ามเผยแพร่</p>
</header>

<div class="search-rail">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อไฟล์ หรือหมวดหมู่..." autocomplete="off">
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<main id="main">
  <div class="skeleton-grid" id="loadingState">
    <div class="skeleton" style="--stagger:0ms"></div>
    <div class="skeleton" style="--stagger:60ms"></div>
    <div class="skeleton" style="--stagger:120ms"></div>
    <div class="skeleton" style="--stagger:180ms"></div>
    <div class="skeleton" style="--stagger:240ms"></div>
    <div class="skeleton" style="--stagger:300ms"></div>
  </div>
</main>

<footer>
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5.5L5.5 17a2 2 0 0 0 1.7 3h9.6a2 2 0 0 0 1.7-3L14 8.5V3"></path></svg>
  ฝ่าย IT Chemistry KMUTT · เก็บทุกชีทไว้ในใจ
</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxz7shP023tKRqA_V57WLeQFgzQTxfFSawvGMz8KxgIz_ASsys5fwdx0GYlZO4CYKcX/exec?export=json";

  const mainEl = document.getElementById('main');
  const searchInput = document.getElementById('searchInput');
  const searchCount = document.getElementById('searchCount');
  const motesEl = document.getElementById('motes');

  let allFiles = [];
  let currentCount = 0;

  // ---------- ambient dust motes ----------
  function spawnMotes(){
    for(let i = 0; i < 10; i++){
      const m = document.createElement('span');
      m.className = 'mote';
      m.style.left = `${Math.random() * 100}%`;
      m.style.bottom = `${Math.random() * 30}%`;
      m.style.animationDelay = `${Math.random() * 7}s`;
      m.style.animationDuration = `${6 + Math.random() * 4}s`;
      motesEl.appendChild(m);
    }
  }
  spawnMotes();

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeRegex(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function highlight(text, rawQuery){
    const safe = escapeHtml(text);
    if(!rawQuery) return safe;
    const safeQuery = escapeHtml(rawQuery);
    if(!safeQuery.trim()) return safe;
    const pattern = new RegExp(escapeRegex(safeQuery), 'gi');
    return safe.replace(pattern, (m) => `<mark>${m}</mark>`);
  }

  function fileExt(name){
    const m = /\.([a-zA-Z0-9]+)$/.exec(name || "");
    return m ? m[1].toUpperCase() : "PDF";
  }

  // deterministic pseudo-random tilt per row, so it stays stable across re-renders
  function tiltForRow(row){
    const n = Number(row) || 0;
    const wobble = Math.sin(n * 12.9898) * 43758.5453;
    const frac = wobble - Math.floor(wobble);
    return (frac * 3.2 - 1.6).toFixed(2) + 'deg';
  }

  function groupByPath(files){
    const groups = {};
    files.forEach(f => {
      const key = f.path || "ไม่ระบุหมวดหมู่";
      if(!groups[key]) groups[key] = [];
      groups[key].push(f);
    });
    return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'th')).map(key => ({
      path: key,
      items: groups[key]
    }));
  }

  function animateCount(to){
    const from = currentCount;
    const duration = 280;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const val = Math.round(from + (to - from) * eased);
      searchCount.textContent = `${val} ไฟล์`;
      if(t < 1) requestAnimationFrame(tick);
      else currentCount = to;
    }
    requestAnimationFrame(tick);
  }

  function observeGroups(){
    const groups = document.querySelectorAll('.drawer-group');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });
    groups.forEach(g => io.observe(g));
  }

  function attachStampHandlers(){
    document.querySelectorAll('a.open-link').forEach(a => {
      a.addEventListener('click', (e) => {
        if(a.classList.contains('stamped')) return;
        e.preventDefault();
        a.classList.add('stamped');
        setTimeout(() => window.open(a.href, '_blank', 'noopener,noreferrer'), 420);
      });
    });
  }

  function renderFiles(files, query){
    if(files.length === 0){
      mainEl.innerHTML = `
        <div class="state">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          <h2>ไม่พบชีทที่ค้นหา</h2>
          <p>ลองพิมพ์คำค้นหาอื่น หรือเช็กการสะกดชื่อไฟล์อีกครั้ง</p>
        </div>`;
      return;
    }

    const groups = groupByPath(files);
    let cardIndex = 0;
    mainEl.innerHTML = groups.map(group => `
      <section class="drawer-group">
        <div class="drawer-label">
          <span class="tab">Drawer</span>
          <span class="path-text">${highlight(group.path, query)}</span>
          <span class="rule"></span>
        </div>
        <div class="card-grid">
          ${group.items.map(f => {
            const delay = (cardIndex++ % 6) * 55;
            return `
            <article class="card" style="--tilt:${tiltForRow(f.row)}; --stagger:${delay}ms">
              <svg class="pin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="5" fill="#a3384a"/><rect x="10.6" y="12" width="2.8" height="9" rx="1.2" fill="#7f2836"/></svg>
              ${f.status ? `<span class="status-note">${escapeHtml(f.status)}</span>` : ''}
              <div class="file-icon">${escapeHtml(fileExt(f.name))}</div>
              <h3>${highlight(f.name, query)}</h3>
              <span class="row-id">#${escapeHtml(f.row)}</span>
              <p class="path-breadcrumb">${highlight(f.path, query)}</p>
              <a class="open-link" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">
                เปิดไฟล์ PDF
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              </a>
            </article>
          `}).join('')}
        </div>
      </section>
    `).join('');

    observeGroups();
    attachStampHandlers();
  }

  function applySearch(){
    const q = searchInput.value.trim();
    const qLower = q.toLowerCase();
    const filtered = qLower
      ? allFiles.filter(f =>
          (f.name || "").toLowerCase().includes(qLower) ||
          (f.path || "").toLowerCase().includes(qLower))
      : allFiles;

    animateCount(filtered.length);
    renderFiles(filtered, q);
  }

  function showError(message){
    mainEl.innerHTML = `
      <div class="state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path><line x1="9" y1="13" x2="15" y2="13"></line></svg>
        <h2>โหลดข้อมูลไม่สำเร็จ</h2>
        <p>${escapeHtml(message)}</p>
        <button onclick="loadFiles()">ลองใหม่อีกครั้ง</button>
      </div>`;
  }

  async function loadFiles(){
    mainEl.innerHTML = `
      <div class="skeleton-grid">
        <div class="skeleton" style="--stagger:0ms"></div><div class="skeleton" style="--stagger:60ms"></div><div class="skeleton" style="--stagger:120ms"></div>
        <div class="skeleton" style="--stagger:180ms"></div><div class="skeleton" style="--stagger:240ms"></div><div class="skeleton" style="--stagger:300ms"></div>
      </div>`;
    searchCount.textContent = "";
    currentCount = 0;

    try{
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับสถานะ ${res.status}`);
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error("รูปแบบข้อมูลที่ได้รับไม่ถูกต้อง");

      allFiles = data;

      if(allFiles.length === 0){
        mainEl.innerHTML = `
          <div class="state">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 7l3-4h12l3 4"></path></svg>
            <h2>ยังไม่มีเอกสารในคลัง</h2>
            <p>เมื่อมีการอัปโหลดชีทใหม่ รายการจะแสดงที่นี่โดยอัตโนมัติ</p>
          </div>`;
        return;
      }

      animateCount(allFiles.length);
      renderFiles(allFiles, "");
    }catch(err){
      showError(err.message || "ไม่สามารถเชื่อมต่อกับ API ได้ กรุณาตรวจสอบ URL หรือลองใหม่อีกครั้ง");
    }
  }

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applySearch, 150);
  });

  loadFiles();
</script>

</body>
</html>
