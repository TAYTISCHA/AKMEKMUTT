<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังชีทเรียน — ภาควิชาเคมี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f0e2;
    --wood: #d8c8a3;
    --wood-dark: #b89f6d;
    --ink: #23301f;
    --ink-soft: #5b6553;
    --green: #2f6844;
    --green-deep: #1f4b31;
    --amber: #c07a3d;
    --red: #a3384a;
    --card: #fffdf7;
    --border: #ddd0ac;
    --shadow: rgba(35, 48, 31, 0.16);
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(216,200,163,0.35), transparent 60%),
      var(--bg);
    font-family: 'Sarabun', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ---------- Header : drawer front ---------- */
  header{
    position: relative;
    background: linear-gradient(180deg, var(--wood-dark), var(--wood) 90%);
    border-bottom: 6px solid var(--green-deep);
    padding: 56px 24px 40px;
    text-align: center;
    overflow: hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 90px);
    pointer-events:none;
  }
  .drawer-pull{
    width: 64px; height: 10px;
    background: var(--green-deep);
    border-radius: 6px;
    margin: 0 auto 22px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2) inset, 0 3px 4px rgba(0,0,0,0.25);
  }
  header h1{
    font-family: 'Taviraj', serif;
    font-weight: 700;
    font-size: clamp(2rem, 4.5vw, 3rem);
    margin: 0 0 8px;
    color: var(--green-deep);
    letter-spacing: 0.5px;
  }
  header p{
    margin: 0;
    color: #4a4023;
    font-size: 1rem;
    max-width: 46ch;
    margin: 0 auto;
    opacity: 0.85;
  }
  .label-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green-deep);
    background: rgba(255,253,247,0.65);
    border: 1px solid rgba(31,75,49,0.3);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  /* ---------- Search rail ---------- */
  .search-rail{
    max-width: 720px;
    margin: -26px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 5;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    box-shadow: 0 10px 24px var(--shadow);
  }
  .search-box svg{ flex:none; color: var(--ink-soft); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Sarabun', sans-serif;
    font-size: 1rem;
    color: var(--ink);
  }
  .search-box input::placeholder{ color:#9a927b; }
  .search-count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* ---------- Main content ---------- */
  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 20px 100px;
  }

  .drawer-group{
    margin-bottom: 38px;
  }
  .drawer-label{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .drawer-label .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: var(--green-deep);
    color: #f6f0e2;
    padding: 5px 12px;
    border-radius: 2px 10px 10px 2px;
  }
  .drawer-label .path-text{
    font-family:'Taviraj', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--green-deep);
  }
  .drawer-label .rule{
    flex:1;
    height:1px;
    background: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 10px);
  }

  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card{
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px 18px;
    box-shadow: 0 1px 0 rgba(35,48,31,0.05);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    opacity: 0;
    transform: translateY(8px) rotate(-0.3deg);
    animation: cardIn 0.45s ease forwards;
  }
  .card:nth-child(3n+1){ transform-origin: top left; }
  .card:hover{
    transform: translateY(-4px) rotate(0.2deg);
    box-shadow: 0 14px 26px var(--shadow);
    border-color: var(--wood-dark);
  }
  @keyframes cardIn{
    to{ opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  .card .row-id{
    position:absolute;
    top: -9px; left: 16px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--card);
    background: var(--amber);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }

  .card .status-note{
    position:absolute;
    top: -10px; right: 10px;
    background: #fff6c4;
    color: #6b5a1d;
    font-size: 0.68rem;
    font-family:'Sarabun', sans-serif;
    padding: 4px 10px;
    border-radius: 2px;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.18);
    transform: rotate(3deg);
    max-width: 70%;
  }

  .card .file-icon{
    width: 34px; height: 34px;
    border-radius: 6px;
    background: linear-gradient(160deg, var(--red), #7f2836);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    font-weight:600;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .card h3{
    font-family:'Taviraj', serif;
    font-size: 1.08rem;
    font-weight: 600;
    margin: 0 0 6px;
    color: var(--ink);
    line-height: 1.35;
    word-break: break-word;
  }

  .card .path-breadcrumb{
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .card a.open-link{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    font-family:'Sarabun', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--green-deep);
    text-decoration: none;
    border-bottom: 1.5px solid transparent;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .card a.open-link:hover{
    border-color: var(--green-deep);
  }
  .card a.open-link:focus-visible,
  .search-box input:focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }

  /* ---------- States ---------- */
  .state{
    text-align:center;
    padding: 70px 20px;
    color: var(--ink-soft);
  }
  .state h2{
    font-family:'Taviraj', serif;
    color: var(--ink);
    font-size: 1.4rem;
    margin: 14px 0 8px;
  }
  .state p{ margin: 0 auto; max-width: 40ch; font-size: 0.94rem; }
  .state button{
    margin-top: 20px;
    font-family:'Sarabun', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: #fff;
    background: var(--green-deep);
    border:none;
    padding: 10px 22px;
    border-radius: 4px;
    cursor: pointer;
  }
  .state button:hover{ background: var(--green); }

  .skeleton-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .skeleton{
    height: 130px;
    border-radius: var(--radius);
    background: linear-gradient(100deg, #ece2c8 20%, #f7f1e2 40%, #ece2c8 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border: 1px solid var(--border);
  }
  @keyframes shimmer{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  footer{
    text-align:center;
    padding: 24px;
    font-size: 0.75rem;
    color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="drawer-pull"></div>
  <span class="label-tag">Chemistry Dept. Archive</span>
  <h1>คลังชีทเรียน</h1>
  <p>ค้นหาและเปิดอ่านเอกสารประกอบการเรียนที่รุ่นพี่รวบรวมไว้ให้น้อง ๆ</p>
</header>

<div class="search-rail">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="ค้นหาชื่อไฟล์ หรือหมวดหมู่..." autocomplete="off">
    <span class="search-count" id="searchCount"></span>
  </div>
</div>

<main id="main">
  <div class="skeleton-grid" id="loadingState">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer>IT Chemistry KMUTT · เก็บทุกชีทไว้ในลิ้นชักเดียวกัน</footer>

<script>
  // ----- แก้ไข URL นี้เป็น Web App URL ของ Google Apps Script คุณ -----
  const API_URL = "https://script.google.com/macros/s/AKfycbxz7shP023tKRqA_V57WLeQFgzQTxfFSawvGMz8KxgIz_ASsys5fwdx0GYlZO4CYKcX?export=json";

  const mainEl = document.getElementById('main');
  const searchInput = document.getElementById('searchInput');
  const searchCount = document.getElementById('searchCount');

  let allFiles = [];

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fileExt(name){
    const m = /\.([a-zA-Z0-9]+)$/.exec(name || "");
    return m ? m[1].toUpperCase() : "PDF";
  }

  function groupByPath(files){
    const groups = {};
    files.forEach(f => {
      const key = f.path || "ไม่ระบุหมวดหมู่";
      if(!groups[key]) groups[key] = [];
      groups[key].push(f);
    });
    return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'th')).map(key => ({
      path: key,
      items: groups[key]
    }));
  }

  function renderFiles(files){
    if(files.length === 0){
      mainEl.innerHTML = `
        <div class="state">
          <h2>ไม่พบชีทที่ค้นหา</h2>
          <p>ลองพิมพ์คำค้นหาอื่น หรือเช็กการสะกดชื่อไฟล์อีกครั้ง</p>
        </div>`;
      return;
    }

    const groups = groupByPath(files);
    mainEl.innerHTML = groups.map(group => `
      <section class="drawer-group">
        <div class="drawer-label">
          <span class="tab">Drawer</span>
          <span class="path-text">${escapeHtml(group.path)}</span>
          <span class="rule"></span>
        </div>
        <div class="card-grid">
          ${group.items.map(f => `
            <article class="card">
              <span class="row-id">#${escapeHtml(f.row)}</span>
              ${f.status ? `<span class="status-note">${escapeHtml(f.status)}</span>` : ''}
              <div class="file-icon">${escapeHtml(fileExt(f.name))}</div>
              <h3>${escapeHtml(f.name)}</h3>
              <p class="path-breadcrumb">${escapeHtml(f.path)}</p>
              <a class="open-link" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">
                เปิดไฟล์ PDF
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              </a>
            </article>
          `).join('')}
        </div>
      </section>
    `).join('');
  }

  function applySearch(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q
      ? allFiles.filter(f =>
          (f.name || "").toLowerCase().includes(q) ||
          (f.path || "").toLowerCase().includes(q))
      : allFiles;

    searchCount.textContent = q ? `${filtered.length} / ${allFiles.length} ไฟล์` : `${allFiles.length} ไฟล์ทั้งหมด`;
    renderFiles(filtered);
  }

  function showError(message){
    mainEl.innerHTML = `
      <div class="state">
        <h2>โหลดข้อมูลไม่สำเร็จ</h2>
        <p>${escapeHtml(message)}</p>
        <button onclick="loadFiles()">ลองใหม่อีกครั้ง</button>
      </div>`;
  }

  async function loadFiles(){
    mainEl.innerHTML = `
      <div class="skeleton-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>`;
    searchCount.textContent = "";

    try{
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับสถานะ ${res.status}`);
      const data = await res.json();

      if(!Array.isArray(data)) throw new Error("รูปแบบข้อมูลที่ได้รับไม่ถูกต้อง");

      allFiles = data;
      searchCount.textContent = `${allFiles.length} ไฟล์ทั้งหมด`;

      if(allFiles.length === 0){
        mainEl.innerHTML = `
          <div class="state">
            <h2>ยังไม่มีเอกสารในคลัง</h2>
            <p>เมื่อมีการอัปโหลดชีทใหม่ รายการจะแสดงที่นี่โดยอัตโนมัติ</p>
          </div>`;
        return;
      }

      renderFiles(allFiles);
    }catch(err){
      showError(err.message || "ไม่สามารถเชื่อมต่อกับ API ได้ กรุณาตรวจสอบ URL หรือลองใหม่อีกครั้ง");
    }
  }

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applySearch, 150);
  });

  loadFiles();
</script>

</body>
</html>
