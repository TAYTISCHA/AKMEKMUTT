<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังชีทเรียน — ตระกูล A</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #faf6f0;
    --surface: #ffffff;
    --ink: #241a12;
    --ink-soft: #79695b;
    --ink-faint: #ab9c8d;
    --line: #e9decc;
    --line-soft: #f2ead9;

    /* สีมหาวิทยาลัย มจธ. — สีแสด PANTONE 172C · สีเหลือง PANTONE 123C · เทา PANTONE 415C */
    --brand: #ff4713;
    --brand-deep: #7c220e;
    --brand-ink: #3d0f05;
    --brand-tint: #ffe9dd;
    --yellow: #ffdd00;
    --grey: #626a74;

    --radius: 4px;
    --radius-lg: 10px;
    --shadow-sm: 0 1px 2px rgba(50,26,10,0.08);
    --shadow-md: 0 8px 24px rgba(50,26,10,0.14);

    --t-pdf-fg: #a13d1e;  --t-pdf-bg: #fbe4d6;
    --t-doc-fg: #2a4d84;  --t-doc-bg: #e2ebf6;
    --t-ppt-fg: #8a6410;  --t-ppt-bg: #f6ecc8;
    --t-xls-fg: #1f6b45;  --t-xls-bg: #dcf0e2;
    --t-img-fg: #7a3a91;  --t-img-bg: #f0e2f7;
    --t-def-fg: #55606a;  --t-def-bg: #eaedf0;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(98,106,116,0.10) 1px, transparent 0);
    background-size: 22px 22px;
    font-family: 'Sarabun', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  mark{ background: #ffdf94; color: inherit; border-radius: 2px; padding: 0 1px; }
  a{ color: inherit; }
  ::selection{ background: var(--yellow); color: var(--brand-ink); }

  .wrap{ max-width: 920px; margin: 0 auto; padding: 0 18px; }

  /* ---------- Hero ---------- */
  .hero{
    position: relative;
    background: var(--brand-deep);
    color: #fff;
    padding: 44px 0 0;
    overflow: hidden;
  }
  .hero::before{
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,0.07), transparent 38%),
      radial-gradient(circle at 88% 82%, rgba(255,221,0,0.10), transparent 42%);
    pointer-events: none;
  }
  .hero-inner{ position: relative; }
  .eyebrow{
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; font-weight: 600; letter-spacing: 1.4px;
    color: rgba(255,255,255,0.68);
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  .eyebrow .dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); flex: none; }

  .hero h1{
    font-size: clamp(1.7rem, 5.4vw, 2.4rem);
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 8px;
    letter-spacing: 0.1px;
  }
  .hero p.sub{
    margin: 0 0 26px;
    font-size: 0.92rem;
    color: rgba(255,255,255,0.72);
    max-width: 46ch;
  }

  .bar-mark{ display:flex; align-items:flex-end; gap: 3px; height: 18px; margin-bottom: 20px; }
  .bar-mark span{ display:block; width: 20px; border-radius: 2px 2px 0 0; }
  .bar-mark span:nth-child(1){ height: 45%; background: var(--grey); opacity: 0.85; }
  .bar-mark span:nth-child(2){ height: 68%; background: var(--yellow); }
  .bar-mark span:nth-child(3){ height: 100%; background: #fff; }

  /* search, docked at the seam between hero and page */
  .search-dock{ position: relative; padding-bottom: 22px; }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background: var(--surface);
    border: 1.5px solid transparent;
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    box-shadow: var(--shadow-md);
    transition: box-shadow 0.15s ease;
  }
  .search-box:focus-within{ box-shadow: var(--shadow-md), 0 0 0 3px rgba(255,71,19,0.28); }
  .search-box svg{ flex:none; color: var(--ink-faint); }
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:'Sarabun', sans-serif; font-size: 1rem; color: var(--ink);
    min-width: 0;
  }
  .search-box input::placeholder{ color:#b4a696; }
  .search-hint{
    flex:none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.64rem; font-weight: 700;
    color: var(--brand-deep);
    background: var(--brand-tint);
    padding: 3px 8px; border-radius: 6px; letter-spacing: 0.3px;
  }
  .search-box.has-value .search-hint{ display: none; }
  .clear-btn{
    flex:none; border:none; background: #eee3d5; color: var(--ink-soft);
    width: 24px; height: 24px; border-radius: 50%;
    display:none; align-items:center; justify-content:center;
    cursor: pointer; font-size: 0.85rem; line-height:1; padding:0;
  }
  .search-box.has-value .clear-btn{ display:flex; }

  /* ---------- Subject table (signature element) ---------- */
  .subjects{ padding: 26px 0 4px; }
  .subjects-head{
    display:flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  .subjects-head h2{
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--ink-soft); margin: 0;
  }
  .subjects-head .all-btn{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; font-weight: 600;
    color: var(--brand-deep);
    background: none; border: none; cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 0.12s ease;
  }
  .subjects-head .all-btn:hover{ text-decoration-color: var(--brand-deep); }

  .subject-row{
    display:flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px;
    scrollbar-width: thin;
  }
  .subject-tile{
    flex: none;
    width: 88px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 8px 9px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.12s ease, transform 0.12s ease, background 0.12s ease;
  }
  .subject-tile:hover{ border-color: var(--brand); transform: translateY(-2px); }
  .subject-tile .n{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem; font-weight: 600; color: var(--ink-faint);
  }
  .subject-tile .code{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.92rem; font-weight: 700; color: var(--ink);
    margin-top: 10px; line-height: 1.15;
    word-break: break-word;
  }
  .subject-tile .count{
    font-size: 0.68rem; color: var(--ink-soft); margin-top: 6px;
  }
  .subject-tile.active{
    background: var(--brand);
    border-color: var(--brand);
  }
  .subject-tile.active .n{ color: rgba(255,255,255,0.75); }
  .subject-tile.active .code{ color: #fff; }
  .subject-tile.active .count{ color: rgba(255,255,255,0.85); }

  /* ---------- Results ---------- */
  main{ padding: 6px 0 90px; }

  .result-count{
    font-size: 0.8rem; color: var(--ink-soft); margin: 4px 2px 16px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .folder{ margin-top: 22px; animation: rise 0.3s ease both; }
  .folder h3{
    display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
    font-size: 0.9rem; font-weight: 700; color: var(--brand-deep);
    margin: 0 0 9px; padding-left: 1px;
  }
  .folder h3 .code{ font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .folder h3 .sep{ color: var(--ink-faint); font-weight: 400; }
  .folder h3 .who{ color: var(--ink-soft); font-weight: 500; font-size: 0.85rem; }

  .list{
    display:flex; flex-direction:column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  .row{
    display:flex; align-items:center; gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line-soft);
    text-decoration: none; color: var(--ink);
    transition: background 0.12s ease;
  }
  .row:last-child{ border-bottom: none; }
  .row:hover, .row:focus-visible{ background: var(--brand-tint); }
  .row:focus-visible{ outline: 2px solid var(--brand); outline-offset: -2px; }
  .row:active{ background: #ffdcc9; }

  .row .idx{
    flex: none; width: 20px; text-align: right;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; font-weight: 600; color: var(--ink-faint);
  }

  .row .ext{
    flex:none;
    padding: 4px 7px;
    border-radius: 5px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2px;
  }

  .row .info{ flex: 1; min-width: 0; }
  .row .info .name{
    font-size: 0.94rem; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .info .meta{
    font-size: 0.74rem; color: var(--ink-soft);
    margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .row .status-pill{
    flex:none;
    font-size: 0.66rem; font-weight: 700;
    background: #fff3cf; color: #8a6a00;
    padding: 3px 9px; border-radius: 20px; white-space: nowrap;
  }

  .row .go{ flex:none; color: var(--ink-faint); transition: transform 0.12s ease, color 0.12s ease; }
  .row:hover .go{ color: var(--brand-deep); transform: translateX(2px); }

  /* ---------- States ---------- */
  .state{ text-align:center; padding: 60px 20px; color: var(--ink-soft); }
  .state svg{ opacity: 0.6; color: var(--brand-deep); }
  .state h2{ font-size: 1.08rem; color: var(--ink); margin: 14px 0 6px; font-weight: 700; }
  .state p{ margin: 0 auto; max-width: 40ch; font-size: 0.88rem; line-height: 1.5; }
  .state button{
    margin-top: 18px;
    font-family:'Sarabun', sans-serif; font-weight: 600; font-size: 0.88rem;
    color: #fff; background: var(--brand-deep); border:none;
    padding: 10px 22px; border-radius: 8px; cursor: pointer;
    transition: background 0.12s ease;
  }
  .state button:hover{ background: var(--brand); }

  .skeleton-tiles{ display:flex; gap:8px; padding: 2px 2px 12px; }
  .skel-tile{ width: 88px; height: 78px; border-radius: var(--radius); flex: none;
    background: linear-gradient(100deg, #ece2d0 25%, #f6efe4 45%, #ece2d0 65%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite; }

  .skeleton-list{
    display:flex; flex-direction:column; gap: 1px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-lg); overflow: hidden;
  }
  .skel-row{
    height: 60px;
    background: linear-gradient(100deg, #ece2d0 25%, #f6efe4 45%, #ece2d0 65%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }
  @keyframes rise{ from{ opacity: 0; transform: translateY(6px); } to{ opacity: 1; transform: translateY(0); } }

  footer{
    text-align:center; padding: 24px 0 30px;
    font-size: 0.72rem; color: var(--ink-faint);
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.4px;
  }

  @media (max-width: 480px){
    .row .meta{ display: none; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap hero-inner">
    <p class="eyebrow"><span class="dot"></span>มจธ. · คณะวิทยาศาสตร์ · ตระกูล A</p>
    <h1>คลังชีทเรียน</h1>
    <p class="sub">สำหรับตระกูล A เท่านั้น · ห้ามเผยแพร่ภายนอก</p>
    <div class="bar-mark" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="wrap search-dock">
  <div class="search-box" id="searchBox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="ค้นหารหัสวิชา เช่น CHM10101" autocomplete="off" inputmode="search">
    <span class="search-hint">รหัสวิชา</span>
    <button class="clear-btn" id="clearBtn" aria-label="ล้างคำค้นหา">✕</button>
  </div>
</div>

<div class="wrap subjects">
  <div class="subjects-head">
    <h2>เลือกรายวิชา</h2>
    <button class="all-btn" id="allBtn">แสดงทั้งหมด</button>
  </div>
  <div class="subject-row" id="subjectRow">
    <div class="skeleton-tiles">
      <div class="skel-tile"></div><div class="skel-tile"></div><div class="skel-tile"></div>
      <div class="skel-tile"></div><div class="skel-tile"></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="result-count" id="resultCount"></div>
  <main id="main">
    <div class="skeleton-list">
      <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
    </div>
  </main>
</div>

<footer>KS</footer>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxz7shP023tKRqA_V57WLeQFgzQTxfFSawvGMz8KxgIz_ASsys5fwdx0GYlZO4CYKcX/exec?export=json";

  const mainEl = document.getElementById('main');
  const searchInput = document.getElementById('searchInput');
  const searchBox = document.getElementById('searchBox');
  const clearBtn = document.getElementById('clearBtn');
  const resultCount = document.getElementById('resultCount');
  const subjectRow = document.getElementById('subjectRow');
  const allBtn = document.getElementById('allBtn');

  let allFiles = [];
  let activeGroup = "";

  function toStr(v){
    if(v === null || v === undefined) return "";
    if(typeof v === "string") return v;
    if(Array.isArray(v)) return v.join(" / ");
    if(typeof v === "object") return JSON.stringify(v);
    return String(v);
  }

  function escapeHtml(str){
    return toStr(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function escapeRegex(str){ return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function normCode(str){ return toStr(str).toLowerCase().replace(/\s+/g, ''); }

  function highlight(text, rawQuery){
    const safe = escapeHtml(text);
    if(!rawQuery || !rawQuery.trim()) return safe;
    const pattern = new RegExp(escapeRegex(escapeHtml(rawQuery)), 'gi');
    return safe.replace(pattern, (m) => `<mark>${m}</mark>`);
  }

  function pathParts(path){
    return toStr(path).split('/').map(s => s.trim()).filter(Boolean);
  }

  // "รหัสวิชา" = ส่วนของ path ที่มีรูปแบบ ตัวอักษร+ตัวเลข เช่น MIC191, CHM161, CHM101, CHM 10101
  // ความลึกของโฟลเดอร์ไม่คงที่ เลยหาโดยดู "รูปแบบ" ของชื่อ ไม่ใช่ตำแหน่งตายตัว
  // ถ้ามีหลายส่วนตรงแบบ (เช่น CHM101 แล้วตามด้วย CHM 10101) ให้ยึดตัวที่ลึกสุด/เจาะจงที่สุด
  function isCodeSegment(s){
    return /^[A-Za-zก-๙]{2,8}\s?\d{2,8}$/.test(toStr(s).trim());
  }
  function codeIndex(parts){
    let idx = -1;
    parts.forEach((p, i) => { if(isCodeSegment(p)) idx = i; });
    return idx;
  }
  function courseCode(path){
    const parts = pathParts(path);
    const idx = codeIndex(parts);
    if(idx !== -1) return parts[idx];
    if(parts.length >= 2) return parts[parts.length - 2];
    return parts[0] || "";
  }
  function courseLabel(path){
    const parts = pathParts(path);
    const idx = codeIndex(parts);
    if(idx !== -1) return parts.slice(idx).join(' / ');
    if(parts.length >= 2) return parts.slice(-2).join(' / ');
    return parts[0] || "ไม่ระบุหมวดหมู่";
  }

  function fileExt(name){
    const m = /\.([a-zA-Z0-9]+)$/.exec(toStr(name));
    return m ? m[1].toUpperCase() : "PDF";
  }
  function tileClass(ext){
    const e = ext.toLowerCase();
    if(e === 'pdf') return 't-pdf';
    if(['doc','docx'].includes(e)) return 't-doc';
    if(['ppt','pptx'].includes(e)) return 't-ppt';
    if(['xls','xlsx','csv'].includes(e)) return 't-xls';
    if(['jpg','jpeg','png','gif','webp'].includes(e)) return 't-img';
    return 't-def';
  }

  // จัดไฟล์ทั้งหมดเป็น "โฟลเดอร์" ทีเดียว — การค้นหา/กรองทำงานบนระดับโฟลเดอร์นี้เท่านั้น
  function buildFolders(files){
    const groups = {};
    files.forEach(f => {
      const key = courseLabel(f.path);
      if(!groups[key]){
        groups[key] = { label: key, code: courseCode(f.path), items: [] };
      }
      groups[key].items.push(f);
    });
    return Object.values(groups).sort((a,b)=>a.label.localeCompare(b.label,'th'));
  }

  function renderSubjects(allFolders){
    if(allFolders.length === 0){ subjectRow.innerHTML = ""; return; }
    subjectRow.innerHTML = allFolders.map((g, i) => {
      const code = g.label.split(' / ')[0] || g.code;
      return `
        <button class="subject-tile${activeGroup === g.label ? ' active' : ''}" data-label="${escapeHtml(g.label)}">
          <div class="n">${String(i + 1).padStart(2,'0')}</div>
          <div class="code">${escapeHtml(code)}</div>
          <div class="count">${g.items.length} ไฟล์</div>
        </button>`;
    }).join('');
    subjectRow.querySelectorAll('.subject-tile').forEach(btn => {
      btn.addEventListener('click', () => {
        const label = btn.getAttribute('data-label');
        activeGroup = (activeGroup === label) ? "" : label;
        applyFilters();
        document.getElementById('main').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
  }

  function renderFolders(folders, query){
    if(folders.length === 0){
      mainEl.innerHTML = `
        <div class="state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
          <h2>ไม่พบโฟลเดอร์ที่ค้นหา</h2>
          <p>ลองพิมพ์รหัสวิชาอื่น หรือกด "แสดงทั้งหมด" อีกครั้ง</p>
        </div>`;
      return;
    }

    mainEl.innerHTML = folders.map(group => {
      const parts = group.label.split(' / ');
      const code = parts[0] || group.label;
      const who = parts.slice(1).join(' / ');
      return `
      <section class="folder">
        <h3><span class="code">${highlight(code, query)}</span>${who ? `<span class="sep">/</span><span class="who">${escapeHtml(who)}</span>` : ''}</h3>
        <div class="list">
          ${group.items.map((f, i) => {
            const ext = fileExt(f.name);
            return `
            <a class="row" href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer">
              <span class="idx">${String(i + 1).padStart(2,'0')}</span>
              <span class="ext ${tileClass(ext)}">${escapeHtml(ext)}</span>
              <span class="info">
                <span class="name">${escapeHtml(f.name)}</span>
                <span class="meta">${escapeHtml(group.label)}</span>
              </span>
              ${f.status ? `<span class="status-pill">${escapeHtml(f.status)}</span>` : ''}
              <svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>`;
          }).join('')}
        </div>
      </section>`;
    }).join('');
  }

  function applyFilters(){
    const q = searchInput.value.trim();
    const qNorm = normCode(q);

    const allFolders = buildFolders(allFiles);

    let folders = allFolders;
    if(activeGroup){
      folders = folders.filter(g => g.label === activeGroup);
    }
    if(qNorm){
      folders = folders.filter(g => normCode(g.code).includes(qNorm));
    }

    const fileCount = folders.reduce((sum, g) => sum + g.items.length, 0);
    resultCount.textContent = `${fileCount} ไฟล์ · ${folders.length} โฟลเดอร์`;
    searchBox.classList.toggle('has-value', q.length > 0);
    renderSubjects(allFolders);
    renderFolders(folders, q);
  }

  function showError(message){
    subjectRow.innerHTML = "";
    resultCount.textContent = "";
    mainEl.innerHTML = `
      <div class="state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path><line x1="9" y1="13" x2="15" y2="13"></line></svg>
        <h2>โหลดข้อมูลไม่สำเร็จ</h2>
        <p>${escapeHtml(message)}</p>
        <button onclick="loadFiles()">ลองใหม่อีกครั้ง</button>
      </div>`;
  }

  async function loadFiles(){
    mainEl.innerHTML = `
      <div class="skeleton-list">
        <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
      </div>`;
    resultCount.textContent = "";
    subjectRow.innerHTML = `
      <div class="skeleton-tiles">
        <div class="skel-tile"></div><div class="skel-tile"></div><div class="skel-tile"></div>
        <div class="skel-tile"></div><div class="skel-tile"></div>
      </div>`;

    try{
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับสถานะ ${res.status}`);
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error("รูปแบบข้อมูลที่ได้รับไม่ถูกต้อง");

      allFiles = data;

      if(allFiles.length === 0){
        subjectRow.innerHTML = "";
        mainEl.innerHTML = `
          <div class="state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 7l3-4h12l3 4"></path></svg>
            <h2>ยังไม่มีเอกสารในคลัง</h2>
            <p>เมื่อมีการอัปโหลดชีทใหม่ รายการจะแสดงที่นี่โดยอัตโนมัติ</p>
          </div>`;
        return;
      }

      applyFilters();
    }catch(err){
      showError(err.message || "ไม่สามารถเชื่อมต่อกับ API ได้ กรุณาตรวจสอบ URL หรือลองใหม่อีกครั้ง");
    }
  }

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applyFilters, 120);
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = "";
    applyFilters();
    searchInput.focus();
  });
  allBtn.addEventListener('click', () => {
    activeGroup = "";
    searchInput.value = "";
    applyFilters();
  });

  loadFiles();
</script>

</body>
</html>
